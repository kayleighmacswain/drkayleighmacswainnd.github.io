<svg xmlns="http://www.w3.org/2000/svg" width="600" height="120" viewBox="0 0 600 120">
  <!-- Background -->
  <rect width="600" height="120" fill="#3b2e28"/>

  <!-- Subtle texture lines -->
  <line x1="0" y1="110" x2="600" y2="110" stroke="#6b4f44" stroke-width="0.5"/>
  <line x1="0" y1="10" x2="600" y2="10" stroke="#6b4f44" stroke-width="0.5"/>

  <!-- Botanical sprig icon -->
  <g transform="translate(36, 22)" stroke="#b5614a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="14" y1="72" x2="14" y2="16"/>
    <path d="M14 52 C9 48 4 50 2 46 C6 42 11 44 14 48"/>
    <path d="M14 38 C19 34 24 36 26 32 C22 28 17 30 14 34"/>
    <path d="M14 63 C11 59 7 60 5 57 C8 54 12 55 14 59"/>
