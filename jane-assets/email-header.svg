  </g>

  <!-- Name -->
  <text x="80" y="52" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="400" fill="#f7f3ee" letter-spacing="1">Dr. Kayleigh MacSwain, ND</text>

